services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sgbc_django
      MYSQL_USER: sgbc
      MYSQL_PASSWORD: sgbc_dev_password
      MYSQL_ROOT_PASSWORD: sgbc_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MYSQL_DATABASE: sgbc_django
      MYSQL_USER: sgbc
      MYSQL_PASSWORD: sgbc_dev_password
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    volumes:
      - ./datamodel_demo:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: